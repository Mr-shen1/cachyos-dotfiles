
# ====================================
# Alacritty - Tokyo Night Dark
# ====================================

[general]
live_config_reload = true
import = [
  "~/.config/alacritty/themes/themes/tokyo_night.toml"
]

# 窗口设置
[window]
dimensions = { columns = 120, lines = 35 }
padding = { x = 10, y = 8 }
dynamic_padding = true
startup_mode = "Maximized"
decorations = "None"
opacity = 0.98
title = "Alacritty"

# 字体设置
[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

# 保持默认字体偏移，避免图标错位
[font.offset]
x = 0
y = 0

# 光标设置
[cursor]
style = { shape = "Block", blinking = "Off" }

# 滚动历史
[scrolling]
history = 50000
multiplier = 3

# 鼠标选择自动复制到选择缓冲区
[selection]
save_to_clipboard = false

# 自定义快捷键
[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Enter", mods = "Alt", chars = "\u001b[13;3u" },
  { key = "Enter", mods = "Shift", chars = "\u001b[13;2u" }
]

[terminal.shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-s", "main"]
